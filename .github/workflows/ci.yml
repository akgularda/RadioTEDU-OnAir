name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg tools
        run: choco install ffmpeg --yes --no-progress
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Python unit and integration tests
        run: python -m pytest tests/unit tests/integration -q --disable-warnings
      - name: JavaScript tests
        shell: powershell
        run: Get-ChildItem tests/js/*.test.cjs | ForEach-Object { node --test $_.FullName }
      - name: Deterministic wall syntax
        run: node --check app/static/deterministic-wall/app.js
